name: ecommerce

services:
  api:
    build:
      context: ./backend
      target: runner
    env_file: ./backend/.env          # Neon, Upstash, Cloudinary, JWT, CLIENT_ORIGIN...
    environment:
      PORT: 5000
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  shop:
    build:
      context: ./shop
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000   # origin only, baked at BUILD time
    environment:
      API_INTERNAL_URL: http://api:5000              # origin only, read at RUNTIME
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: http://localhost:5000/api      # to confirm, see below
    ports:
      - "5174:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # On demand only: docker compose --profile tools run --rm migrate
  migrate:
    build:
      context: ./backend
      target: tools
    env_file: ./backend/.env
    profiles: ["tools"]